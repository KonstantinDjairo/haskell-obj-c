name:                apple-veclib-gen
version:             0.1.0.0
synopsis:            Generated Haskell bindings for the VecLib framework
license:             BSD-3-Clause

dependencies:
- base >= 4.7 && < 5
- haskell-obj-c
- libffi

ghc-options:
- -Wall
- -Wno-orphans
- -Wno-unused-imports

library:
  source-dirs: src
  exposed-modules:
  - ObjC.VecLib
  - ObjC.VecLib.Enums
  - ObjC.VecLib.Internal.Enums
  - ObjC.VecLib.Internal.Structs
  - ObjC.VecLib.Structs
