name:                apple-avfoundation-foundation-gen-ext
version:             0.1.0.0
synopsis:            Generated Haskell bindings for the AVFoundation extensions on Foundation framework
license:             BSD-3-Clause

dependencies:
- base >= 4.7 && < 5
- haskell-obj-c
- libffi
- apple-avfoundation-gen
- apple-foundation-gen

ghc-options:
- -Wall
- -Wno-orphans
- -Wno-unused-imports

library:
  source-dirs: src
  exposed-modules:
  - ObjC.AVFoundation.NSCoder
  - ObjC.AVFoundation.NSValue
