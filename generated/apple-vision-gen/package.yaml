name:                apple-vision-gen
version:             0.1.0.0
synopsis:            Generated Haskell bindings for the Vision framework
license:             BSD-3-Clause

dependencies:
- base >= 4.7 && < 5
- haskell-obj-c
- libffi
- apple-coreimage-gen
- apple-coreml-gen
- apple-foundation-gen

ghc-options:
- -Wall
- -Wno-orphans
- -Wno-unused-imports

