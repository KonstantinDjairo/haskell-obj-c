name:                apple-uniformtypeidentifiers-gen
version:             0.1.0.0
synopsis:            Generated Haskell bindings for the UniformTypeIdentifiers framework
license:             BSD-3-Clause

dependencies:
- base >= 4.7 && < 5
- haskell-obj-c
- libffi
- apple-foundation-gen

ghc-options:
- -Wall
- -Wno-orphans
- -Wno-unused-imports

library:
  source-dirs: src
  exposed-modules:
  - ObjC.UniformTypeIdentifiers.Internal.Classes
  - ObjC.UniformTypeIdentifiers.UTType
