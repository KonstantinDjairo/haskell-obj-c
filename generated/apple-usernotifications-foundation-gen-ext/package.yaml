name:                apple-usernotifications-foundation-gen-ext
version:             0.1.0.0
synopsis:            Generated Haskell bindings for the UserNotifications extensions on Foundation framework
license:             BSD-3-Clause

dependencies:
- base >= 4.7 && < 5
- haskell-obj-c
- libffi
- apple-foundation-gen
- apple-usernotifications-gen

ghc-options:
- -Wall
- -Wno-orphans
- -Wno-unused-imports

library:
  source-dirs: src
  exposed-modules:
  - ObjC.UserNotifications.NSString
